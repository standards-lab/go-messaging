# Project kind: this repository holds production Go source, checked by `mise run check`.
[project]
kind = "code"
check = "mise run check"
# The read-only, development-time command that reports every pin trailing its latest release;
# it reads the network, so CI never runs it.
currency = "mise run currency"

# Remote platform and the commands that publish and merge a finished branch.
# No CI exists yet, so the merge waits on no checks and there is no ci key. The library task's CI
# workflow restores the convention's `gh pr checks --watch &&` merge and the ci wait.
[remote]
platform = "github"
publish = "gh pr create"
merge = "gh pr merge --merge --delete-branch"
