# See architecture/standards/go-elemental/principles/release-and-ci.md
# See architecture/principles/rolling-currency.md
[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"
"aqua:google/go-containerregistry" = "0.22.1"

[env]
GO_MODULES = ". postgres nats"
MESSAGING_DSN = "postgres://app:app@127.0.0.1:{{ get_env(name='POSTGRES_PORT', default='5435') }}/app?sslmode=disable"
MESSAGING_NATS_URL = "nats://127.0.0.1:{{ get_env(name='NATS_PORT', default='4225') }}"

[tasks.check]
description = "Build, vet, format, fix, tidy, test, and lint every module with the workspace off, vet and lint covering the integration build tag, then sqlint the postgres module's statements and migrations; stops at the first failure and writes nothing"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet -tags integration ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
done
echo "check: sqlint"
cd "$MISE_PROJECT_ROOT/postgres"
go tool sqlint .
'''

[tasks.currency]
description = "Report every requirement, Go version, tool, action pin, and image tag (listed with crane) behind its latest; writes nothing"
run = "scripts/currency.sh"

[tasks.upgrade]
description = "Upgrade every module's go directive to the current Go minor with no toolchain line, its direct requirements and the local mise tools to their latest, rewriting go.mod and mise.toml"
run = '''
set -eu
export GOWORK=off
go_minor=$(mise latest go | cut -d. -f1,2)
for mod in $GO_MODULES; do
  cd "$MISE_PROJECT_ROOT/$mod"
  go mod edit -go="$go_minor" -toolchain=none
  direct=$(go mod edit -json | jq -r '.Require[]? | select(.Indirect | not) | .Path')
  [ -z "$direct" ] || go get $(printf '%s@latest ' $direct)
  go mod tidy
done
cd "$MISE_PROJECT_ROOT"
mise upgrade --bump --local
'''

[tasks.tidy]
description = "Run go mod tidy across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  [ -f "$mod/go.mod" ] || continue
  echo "==> tidy: $mod"
  (cd "$mod" && go mod tidy)
done
'''

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.lint]
description = "Run golangci-lint across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  [ -f "$mod/go.mod" ] || continue
  echo "==> lint: $mod"
  (cd "$mod" && golangci-lint run ./...)
done
'''

[tasks.build]
description = "Build each module with the workspace off, proving it resolves its own pins standalone"
run = '''
set -e
for mod in $GO_MODULES; do
  [ -f "$mod/go.mod" ] || continue
  echo "==> build (GOWORK=off): $mod"
  (cd "$mod" && GOWORK=off go build ./...)
done
'''

[tasks.vet]
description = "Run go vet across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  [ -f "$mod/go.mod" ] || continue
  echo "==> vet: $mod"
  (cd "$mod" && go vet ./...)
done
'''

[tasks.test]
description = "Run the unit tier across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  [ -f "$mod/go.mod" ] || continue
  echo "==> test: $mod"
  (cd "$mod" && go test -race ./...)
done
'''

[tasks."integration:postgres"]
description = "Run the postgres module's integration suite against a fresh compose PostgreSQL at MESSAGING_DSN, then stop it, printing its log on failure"
env = { GOWORK = "off" }
run = '''
set -e
trap 'rc=$?; [ $rc -eq 0 ] || docker compose logs postgres; docker compose down postgres; exit $rc' EXIT
docker compose up -d --wait --build postgres
(cd postgres && go test -race -tags integration -count=1 -v ./...)
'''

[tasks."integration:nats"]
description = "Run the nats module's integration suite against a fresh compose NATS at MESSAGING_NATS_URL, then stop it, printing its log on failure"
env = { GOWORK = "off" }
run = '''
set -e
trap 'rc=$?; [ $rc -eq 0 ] || docker compose logs nats; docker compose down nats; exit $rc' EXIT
docker compose up -d --wait --build nats
(cd nats && go test -race -tags integration -count=1 -v ./...)
'''

[tasks.integration]
description = "Run every module's integration suite in turn, each against a fresh compose service, even after one fails"
run = '''
rc=0
mise run integration:postgres || rc=1
mise run integration:nats || rc=1
exit $rc
'''

[tasks.up]
description = "Start every compose service and wait until each is healthy"
run = "docker compose up -d --wait --build"

[tasks.down]
description = "Stop every compose service, discarding its data"
run = "docker compose down"
