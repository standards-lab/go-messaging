# golangci-lint v2 configuration for the nats sub-module, run by `mise run check`: the base
# module's configuration without depguard, with the integration build tag so the check lints the
# integration suite.
# See architecture/standards/go-elemental/principles/tests-and-docs.md
# See architecture/principles/comments.md
version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - nolintlint
    - testpackage
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    testpackage:
      skip-regexp: export_test\.go
