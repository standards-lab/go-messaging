# golangci-lint v2 configuration for the base module, run by `mise run check`: the standard set
# plus depguard, testpackage, and nolintlint.
# See docs/internals.md
# See architecture/standards/go-elemental/principles/dependencies.md
# See architecture/standards/go-elemental/principles/tests-and-docs.md
# See architecture/principles/comments.md
version: "2"

linters:
  default: standard
  enable:
    - depguard
    - nolintlint
    - testpackage
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    testpackage:
      skip-regexp: export_test\.go
    depguard:
      rules:
        production:
          list-mode: strict
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/standards-lab/go-core$
            - github.com/standards-lab/go-core/
            - github.com/standards-lab/sqlate$
            - github.com/standards-lab/sqlate/query$
            - github.com/standards-lab/go-messaging$
            - github.com/standards-lab/go-messaging/
          deny:
            - pkg: github.com/standards-lab/go-messaging/postgres
              desc: the base imports no engine; the postgres sub-module depends on the base
            - pkg: github.com/standards-lab/go-messaging/nats
              desc: the base imports no broker; the nats sub-module depends on the base
        tests:
          list-mode: strict
          files:
            - $test
          allow:
            - $gostd
            - github.com/standards-lab/go-core$
            - github.com/standards-lab/go-core/
            - github.com/standards-lab/sqlate$
            - github.com/standards-lab/sqlate/query$
            - github.com/standards-lab/sqlate/sqltest$
            - github.com/standards-lab/go-messaging$
            - github.com/standards-lab/go-messaging/
          deny:
            - pkg: github.com/standards-lab/go-messaging/postgres
              desc: the base imports no engine; the postgres sub-module depends on the base
            - pkg: github.com/standards-lab/go-messaging/nats
              desc: the base imports no broker; the nats sub-module depends on the base
