# golangci-lint v2 configuration for the postgres sub-module, run by `mise run check`: the standard
# set plus testpackage and nolintlint, with the integration build tag.
# See docs/internals.md
# See architecture/standards/go-elemental/principles/tests-and-docs.md
# See architecture/principles/comments.md
version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - nolintlint
    - testpackage
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    testpackage:
      skip-regexp: export_test\.go
